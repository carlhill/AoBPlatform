# CI — lint, typecheck, build, unit tests, and the database-backed e2e suite
# (RLS fail-closed proofs, HARD-01/02 triggers) against a real Postgres.
# Gates are release-blocking, not advisory (CLAUDE.md §7).
name: CI

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aobplatform
          POSTGRES_PASSWORD: aobplatform
          POSTGRES_DB: aobplatform
        ports:
          - 21020:5432
        options: >-
          --health-cmd "pg_isready -U aobplatform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      immudb:
        # Pinned pair: immudb-node@1.1.1 client ↔ immudb 1.1.0 server.
        image: codenotary/immudb:1.1.0
        ports:
          - 21022:3322
    env:
      DATABASE_URL: postgresql://aob_app:aob_app@localhost:21020/aobplatform?schema=core
      ADMIN_DATABASE_URL: postgresql://aobplatform:aobplatform@localhost:21020/aobplatform?schema=core
      IMMUDB_HOST: localhost
      IMMUDB_PORT: '21022'
      VAULT_DATABASE_URL: postgresql://aob_app:aob_app@localhost:21020/aobplatform?schema=vault
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Initialise database (schemas, app role, migrations)
        run: |
          PGPASSWORD=aobplatform psql -h localhost -p 21020 -U aobplatform -d aobplatform -f infra/postgres/init-schemas.sql
          PGPASSWORD=aobplatform psql -h localhost -p 21020 -U aobplatform -d aobplatform -f infra/postgres/init-roles.sql
          npm run prisma:generate -w apps/core
          npm run prisma:generate -w apps/vault
          DATABASE_URL="$ADMIN_DATABASE_URL" npm run prisma:deploy -w apps/core
          VAULT_DATABASE_URL="postgresql://aobplatform:aobplatform@localhost:21020/aobplatform?schema=vault" npm run prisma:deploy -w apps/vault
      # The workspaces consume the packages' BUILD OUTPUT, not their source, so
      # a clean checkout cannot typecheck until the packages exist: every web
      # file importing @aobplatform/domain failed with TS2307, and the run died
      # before lint or the realm guard had reported anything at all.
      - run: npm run build:packages
      - run: npm run lint
      - run: npm run typecheck
      - name: Realm guard (rule 15 — passkey required, no password path)
        run: npm run validate:realm
      - run: npm run build
      - run: npm run test
      - name: e2e (real Nest apps; core against real Postgres)
        env:
          # The artefact store defaults to /var/lib/aobplatform, which the runner cannot create.
          ARTEFACT_STORE_ROOT: ${{ runner.temp }}/aob-artefacts
        run: npm run test:e2e
