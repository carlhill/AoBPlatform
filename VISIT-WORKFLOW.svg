<?xml version="1.0" encoding="UTF-8"?>
<svg style="background:#ffffff" viewBox="0 0 1600 716" role="img" aria-label="Swim-lane diagram of a bulk-billed GP visit across Patient, PMS, AoBPlatform and Medicare. Pre-billing: booking, pre-visit agreement link, arrival, check for an approved enduring or episodic agreement, tablet capture if none, consultation. Billing gate: the PMS cannot bill unless a patient-approved enduring or episodic agreement is on file for this practitioner today. Post-billing: invoice, claim to Medicare, benefit paid, reports reconciled against the agreement." xmlns="http://www.w3.org/2000/svg" font-family="'Source Sans 3', 'Segoe UI', system-ui, sans-serif" font-size="12">
