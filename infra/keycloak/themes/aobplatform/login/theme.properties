# The AoBPlatform LOGIN theme.
#
# WHY IT EXISTS. Passkey enrolment is the one screen where the platform hands
# the person over to their browser and their operating system, and then says
# nothing while three or four dialogs it did not draw appear in front of them.
# On Windows the very first of those dialogs offers the WRONG passkey provider
# by default: Microsoft Password Manager, whose PIN unlocks its own vault and
# does not set the WebAuthn user-verification flag. Enrolment succeeds, sign-in
# is then refused, and nothing on the screen explains why (CRITICAL-ISSUES.md
# section 2). The guidance panel is that explanation, placed where the person
# is when they need it.
#
# WHAT IT CHANGES. One template, `webauthn-register.ftl`, and only by wrapping
# the stock markup in a two-column layout and adding an aside beside it. No
# form field, no form action, no script of Keycloak's is touched -- a broken
# login theme locks out every practitioner, so the blast radius is kept to
# markup that the authentication flow never reads.
#
# `parent=keycloak.v2` because that is the server default this realm was
# rendering before the theme was applied (verified by reading the served
# stylesheet, not by trusting the docs -- the README lesson).
parent=keycloak.v2
import=common/keycloak

# `styles` REPLACES the parent's list rather than extending it, so the parent's
# own sheet is named again here. `css/styles.css` still resolves out of
# keycloak.v2: theme resources fall through the parent chain.
styles=css/styles.css css/aob-login.css
