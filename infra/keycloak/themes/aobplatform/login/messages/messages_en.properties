# Passkey enrolment guidance -- the string table for the panel beside the
# "Passkey Registration" box (login/webauthn-register.ftl).
#
# THE STEPS ARE CONTENT, NOT MARKUP. The template renders whatever is here, in
# this order, and carries no sentence of its own. A dialog that changes wording
# in a Chrome or Windows update is fixed by editing this file -- no template
# change, no code review of FreeMarker, no redeploy of anything but the theme.
#
# TWO RULES WHEN EDITING.
#
#   1. NO APOSTROPHES, NO BRACES. Keycloak passes every message through
#      java.text.MessageFormat, which eats a lone ' and treats { } as
#      placeholders. Keycloak's own bundle writes "passkey''s" for exactly this
#      reason. Write around it instead: "the passkey label", not "the passkey's
#      label".
#   2. THE COUNT MUST MATCH THE STEPS. aobPasskeyStepCount<Platform> tells the
#      template how many aobPasskeyStep<Platform><n> keys to render.
#
#      A missing STEP key is harmless: it renders as its own name, which is
#      ugly and obvious. The COUNT key is different -- it is the only value in
#      this file that is read as a NUMBER rather than printed, so a missing or
#      non-numeric one would abort the whole page render if the template let
#      it. The template does not: it parses the count defensively and renders
#      an empty list instead, and the guidance panel as a whole is wrapped so
#      that it can never take enrolment down with it. Do not rely on that --
#      keep the counts in step. `npm run validate:realm` checks them.
#
# UK/AU spelling. Never "certified", "approved", "accredited" or
# "government-approved" (CLAUDE.md hard rule 12).

aobPasskeyGuidanceTitle=What happens next
aobPasskeyGuidanceIntro=After you choose Register, your browser and your device show their own dialogs. These are the ones to expect.
aobPasskeyPickerLabel=Show the steps for
aobPasskeyStepsHeadingSuffix=steps

aobPasskeyPlatformWindows=Windows PC
aobPasskeyPlatformMac=Mac
aobPasskeyPlatformAndroid=Android phone or tablet
aobPasskeyPlatformIos=iPhone or iPad

# --- Windows. Every dialog below was screenshotted on the real flow (Carl,
# 12 Sep 2026). Step 3 is the one that matters: see aobPasskeyNoteWindows.
aobPasskeyStepCountWindows=6
aobPasskeyStepWindows1=Leave "Sign out from other devices" ticked unless you want your other sessions kept, then choose Register.
aobPasskeyStepWindows2=Your browser shows "Create a passkey" and offers to save it to Microsoft Password Manager. Choose "Save another way".
aobPasskeyStepWindows3=On "Select where to save your passkey", choose "Windows Hello or external security key".
aobPasskeyStepWindows4=Windows Security shows "Save your passkey". Choose Continue.
aobPasskeyStepWindows5=Windows Security asks for your PIN, fingerprint or face. Confirm that it is you.
aobPasskeyStepWindows6=Your browser asks for a label for this passkey. Keep the suggested name or type your own, then choose OK.
aobPasskeyNoteWindows=Do not save this passkey to Microsoft Password Manager. The PIN it asks for unlocks the password manager, not Windows, so the passkey it creates cannot be used to sign in here. If a dialog says Microsoft Password Manager, cancel it and go back to step 2.

# --- Mac. Not yet screenshotted end to end -- wording checked against the
# current Chrome and Safari dialogs, and to be confirmed on a real Mac.
aobPasskeyStepCountMac=4
aobPasskeyStepMac1=Leave "Sign out from other devices" ticked unless you want your other sessions kept, then choose Register.
aobPasskeyStepMac2=Your browser shows "Create a passkey" and offers to save it to iCloud Keychain. Choose Continue, or choose Other options to save it somewhere else.
aobPasskeyStepMac3=Confirm with Touch ID, your Apple Watch, or your Mac login password when macOS asks.
aobPasskeyStepMac4=Your browser asks for a label for this passkey. Keep the suggested name or type your own, then choose OK.
aobPasskeyNoteMac=A passkey saved to iCloud Keychain also works on your iPhone and iPad while they are signed in to the same Apple Account. One saved to a browser profile only works in that browser.

# --- Android. Not yet screenshotted end to end.
aobPasskeyStepCountAndroid=4
aobPasskeyStepAndroid1=Leave "Sign out from other devices" ticked unless you want your other sessions kept, then choose Register.
aobPasskeyStepAndroid2=Your browser slides up a "Create a passkey" sheet and offers Google Password Manager. Choose Continue, or open the other options to save it somewhere else.
aobPasskeyStepAndroid3=Confirm with your fingerprint, your face, or your screen lock.
aobPasskeyStepAndroid4=Your browser asks for a label for this passkey. Keep the suggested name or type your own, then choose OK.
aobPasskeyNoteAndroid=The device needs a screen lock set. Without one there is nothing to confirm with, and the passkey cannot be created.

# --- iPhone and iPad. Not yet screenshotted end to end.
aobPasskeyStepCountIos=4
aobPasskeyStepIos1=Leave "Sign out from other devices" ticked unless you want your other sessions kept, then choose Register.
aobPasskeyStepIos2=Your browser slides up a sheet offering to save the passkey to iCloud Keychain. Choose Continue.
aobPasskeyStepIos3=Confirm with Face ID, Touch ID, or your device passcode.
aobPasskeyStepIos4=Your browser asks for a label for this passkey. Keep the suggested name or type your own, then choose OK.
aobPasskeyNoteIos=iCloud Keychain needs to be switched on in Settings. A passkey saved there also works on your other Apple devices signed in to the same Apple Account.

aobPasskeyGuidanceHelp=If none of these dialogs appear, the browser may be too old for passkeys. Use a current Chrome, Edge or Safari and try again.
aobPasskeyNoteLabel=Watch out for

# The confirmation page that precedes enrolment lists the required actions by
# name, and Keycloak's login bundle has no entry for this one -- so it printed
# "Perform the following action(s): Webauthn Register Passwordless", an internal
# identifier shown to a person. Named here for the same reason the email theme
# names it: a message full of our internals reads as a system talking to itself.
requiredAction.webauthn-register-passwordless=Set up a passkey
requiredAction.webauthn-register=Set up a passkey
