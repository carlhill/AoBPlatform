# Subject lines. Plain, specific, and never "Update Your Account", which tells
# the recipient nothing and looks like every account-takeover email ever sent.
executeActionsSubject=Set up your AoBPlatform sign-in
emailVerificationSubject=Confirm your email address for AoBPlatform
passwordResetSubject=AoBPlatform does not use passwords

# Named, so that if a template ever does render the action list it renders
# English rather than a message key.
requiredAction.webauthn-register-passwordless=Set up a passkey
requiredAction.webauthn-register=Set up a passkey
requiredAction.UPDATE_PASSWORD=Not used by AoBPlatform
requiredAction.VERIFY_EMAIL=Confirm your email address
requiredAction.UPDATE_PROFILE=Check your details
