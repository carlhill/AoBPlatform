# The AoBPlatform email theme.
#
# WHY IT EXISTS. Keycloak's stock enrolment message reads:
#
#   "Your administrator has just requested that you update your AoBPlatform
#    account by performing the following action(s):
#    requiredAction.webauthn-register-passwordless"
#
# Three things wrong with that, in order of seriousness:
#
#   1. It leaks an internal identifier. `requiredAction.webauthn-register-
#      passwordless` is an untranslated message key, and a message to a
#      practice that contains raw internals reads as a system talking to
#      itself, not to a person.
#   2. The voice is wrong. A newly approved practice does not have "an
#      administrator"; they have just been told they can start.
#   3. No sender identity, no reason-you-got-this, no "we will never ask".
#      We are asking somebody to click a link and enrol a credential, which
#      is exactly what a phishing message asks for. What separates us from
#      one is saying who we are and why they got it -- the same footer every
#      other message we send carries.
#
# The link mechanism stays Keycloak's, deliberately. The action token is what
# actually enrols the passkey; only the words around it are ours.
parent=base
